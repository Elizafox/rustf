[package]
name = "rustf"
version = "0.1.0"
edition = "2024"
rust-version = "1.87.0"
authors = ["Elizabeth Ashford <elizabeth.jennifer.myers@gmail.com>"]
license = "Unlicense"
readme = "README.md"
description = "A BF interpreter and compiler written in Rust"
repository = "https://github.com/Elizafox/rustf"
keywords = ["brainfuck", "compiler", "esoteric", "interpreter", "llvm"]
categories = ["compilers", "command-line-utilities", "emulators",]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
which = "8.0.2"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = 1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
